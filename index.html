<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Всесвіт для Таї</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@400;700&display=swap">
<style>
  /* Layout: full-screen WebGL galaxy, DOM overlays for tappable photos & notes, intro warp on top */
  :root {
    --night: #05010a;
    --ink: #fff3f8;
    --muted: #e6b3cc;
    --rose: #ff3d8b;
    --blush: #ff9cc4;
    --plum: #7a1fa2;
    --panel: rgba(28, 6, 26, 0.82);
    --display: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
    --body: "Comfortaa", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  [hidden] { display: none !important; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* ---------- overlays (photos + note hearts) ---------- */
  #overlays {
    position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: hidden;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #overlays.on { opacity: 1; }
  /* words that drift up from the heart in time with its beat while music plays */
  .love-word {
    position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(26px, 6vw, 40px); white-space: nowrap;
    color: var(--ink);
    text-shadow: 0 0 12px rgba(255, 61, 139, .95), 0 0 30px rgba(255, 61, 139, .55);
    opacity: 0;
    animation: love-rise 4.2s ease-out forwards;
  }
  @keyframes love-rise {
    0%   { opacity: 0; transform: translate(var(--x), var(--y)) translate(-50%, -50%) scale(.7); }
    15%  { opacity: 1; transform: translate(var(--x), var(--y)) translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0; transform: translate(var(--x), calc(var(--y) - 110px)) translate(-50%, -50%) scale(1); }
  }
  .float {
    position: absolute; left: 0; top: 0;
    pointer-events: auto; cursor: pointer;
    border: 0; padding: 0; background: none; color: inherit;
    will-change: transform;
  }
  .float:focus-visible { outline: 2px solid var(--blush); outline-offset: 4px; border-radius: 6px; }
  .polaroid {
    display: block; width: 78px; padding: 5px 5px 16px;
    background: #fff7fb; border-radius: 4px;
    box-shadow: 0 0 18px rgba(255, 61, 139, 0.75), 0 0 46px rgba(255, 61, 139, 0.35);
    transform: rotate(var(--tilt, -4deg));
    transition: box-shadow .25s ease;
  }
  .float:hover .polaroid { box-shadow: 0 0 26px rgba(255, 120, 180, 1), 0 0 60px rgba(255, 61, 139, 0.6); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 2px; background: #2a0f2a; }
  .note-heart { display: block; width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(255, 61, 139, .95)); animation: beat 1.4s ease-in-out infinite; }
  .note-heart svg { width: 100%; height: 100%; display: block; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.96); } 45% { transform: scale(1.1); } }

  /* ---------- card ---------- */
  #card {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    padding-inline: 16px;
    background: rgba(5, 1, 10, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  #card.open { opacity: 1; pointer-events: auto; }
  .card-panel {
    width: min(360px, 100%);
    max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--panel);
    border: 1px solid rgba(255, 156, 196, 0.35);
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: 0 0 40px rgba(255, 61, 139, 0.35);
    transform: translateY(14px) scale(.97); transition: transform .35s cubic-bezier(.2, .9, .3, 1.2);
    text-align: center;
    display: grid; gap: 10px;
  }
  #card.open .card-panel { transform: none; }
  .card-heart { width: 22px; height: 22px; margin: 0 auto; color: var(--rose); }
  #card-img { width: 100%; height: auto; max-height: 56vh; object-fit: contain; border-radius: 12px; background: #2a0f2a; }
  #card-img[hidden] { display: none; }
  #card-title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; color: var(--ink); text-wrap: balance; }
  #card-text { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }
  #card-close {
    justify-self: center; margin-top: 4px;
    font: 700 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); background: transparent;
    border: 1px solid rgba(255, 156, 196, 0.6); border-radius: 999px;
    padding: 10px 22px; cursor: pointer;
  }
  #card-close:hover { background: rgba(255, 61, 139, 0.2); }

  /* ---------- ui ---------- */
  #hint {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 32px);
    font-size: 12px; line-height: 1.5; text-align: center; color: var(--muted);
    background: rgba(28, 6, 26, 0.6); border: 1px solid rgba(255, 156, 196, 0.25);
    padding: 8px 14px; border-radius: 999px;
    opacity: 0; transition: opacity 1s ease; pointer-events: none;
  }
  #hint.on { opacity: 1; }
  #music {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 21;
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--ink); background: rgba(28, 6, 26, 0.7);
    border: 1px solid rgba(255, 156, 196, 0.45); cursor: pointer;
  }
  #music svg { width: 20px; height: 20px; }
  #music.playing { box-shadow: 0 0 16px rgba(255, 61, 139, .8); }
  #music:focus-visible, #card-close:focus-visible, #start:focus-visible { outline: 2px solid var(--blush); outline-offset: 3px; }

  /* ---------- intro ---------- */
  #intro { position: fixed; inset: 0; z-index: 50; background: var(--night); transition: opacity 1.4s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #warp { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .intro-content {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center; gap: 14px;
    padding-inline: 16px; text-align: center;
    transition: opacity 1.2s ease, transform 1.6s ease;
  }
  .intro-content.leaving { opacity: 0; transform: scale(1.15); }
  .intro-eyebrow { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
  .intro-title {
    margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(64px, 18vw, 120px); line-height: .9;
    color: var(--ink);
    text-shadow: 0 0 18px rgba(255, 61, 139, .9), 0 0 48px rgba(255, 61, 139, .55);
  }
  .intro-sub {
    margin: -4px 0 0; max-width: 30ch;
    font-family: var(--display); font-weight: 600;
    font-size: clamp(34px, 9vw, 52px); line-height: 1.1;
    color: var(--blush);
    text-shadow: 0 0 14px rgba(255, 61, 139, .6);
  }
  #start {
    margin-top: 10px;
    font: 700 14px/1 var(--body); letter-spacing: .08em; text-transform: uppercase;
    color: #fff; background: var(--rose);
    border: 0; border-radius: 999px; padding: 15px 28px; cursor: pointer;
    box-shadow: 0 0 24px rgba(255, 61, 139, .8);
    animation: glow 2.2s ease-in-out infinite;
  }
  @keyframes glow { 50% { box-shadow: 0 0 40px rgba(255, 61, 139, 1), 0 0 80px rgba(255, 61, 139, .4); } }
  #fallback { color: var(--muted); font-size: 14px; max-width: 32ch; }

  @media (prefers-reduced-motion: reduce) {
    .note-heart, #start { animation: none; }
  }
</style>

<canvas id="scene" aria-label="Тривимірна галактика з сердцем"></canvas>
<div id="overlays"></div>

<button id="music" type="button" aria-label="Увімкнути музику" hidden>
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18.5a3 3 0 1 1-2-2.83V5.5l12-2.5v12.5a3 3 0 1 1-2-2.83V7.3L9 8.9z"/></svg>
</button>
<div id="hint">Крути пальцем · наближай · торкайся фото та сердечок</div>

<div id="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
  <div class="card-panel">
    <svg class="card-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2 4.5 5.8 4.5c2.1 0 3.5 1.1 4.2 2.4h.1c.7-1.3 2.1-2.4 4.2-2.4 3.8 0 5.5 3.9 3.8 7.2C19.5 16.4 12 21 12 21z"/></svg>
    <img id="card-img" alt="">
    <h2 id="card-title"></h2>
    <p id="card-text"></p>
    <button id="card-close" type="button">Закрити</button>
  </div>
</div>

<div id="intro">
  <canvas id="warp"></canvas>
  <div class="intro-content" id="intro-content">
    <div class="intro-eyebrow" id="intro-eyebrow">Тільки для тебе</div>
    <h1 class="intro-title" id="intro-title">Для Таї</h1>
    <p class="intro-sub" id="intro-sub">У мене є для тебе цілий всесвіт</p>
    <button id="start" type="button">Відкрити ❤</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   ТУТ МОЖНА ВСЕ ЗМІНИТИ ПІД СЕБЕ
   ---------------------------------------------------------------------
   • photos: поклади фото в папку photos (1.jpg, 2.jpg ...).
     Якщо фото немає, замість нього буде мультяшна картинка.
   • phrases: написи, що літають навколо сердця.
   • notes: тексти, які відкриваються при натисканні на сердечка.
   • music: поклади пісню в папку music і впиши назву файлу

const warp = document.getElementById("warp");
const wctx = warp.getContext("2d");
let warpSpeed = 0.7, warpTarget = 0.7, warpRunning = true;
let WW = 0, WH = 0;
const warpStars = [];
function resizeWarp() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  WW = warp.clientWidth; WH = warp.clientHeight;
  warp.width = WW * dpr; warp.height = WH * dpr;
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function newWarpStar(star, far) {
  star.x = (Math.random() - 0.5) * 2000;
  star.y = (Math.random() - 0.5) * 2000;
  star.z = far ? 1000 : Math.random() * 1000;
  star.pz = star.z;
  star.c = Math.random() < 0.55 ? "255,255,255" : (Math.random() < 0.5 ? "255,92,154" : "255,170,205");
  return star;
}
for (let i = 0; i < 700; i++) warpStars.push(newWarpStar({}, false));
function drawWarp() {
  if (!warpRunning) return;
  warpSpeed += (warpTarget - warpSpeed) * 0.015;
  wctx.fillStyle = "rgba(5,1,10,0.35)";
  wctx.fillRect(0, 0, WW, WH);
  const cx = WW / 2, cy = WH / 2, f = Math.min(WW, WH) * 0.6;
  for (const s of warpStars) {
    s.pz = s.z;
    s.z -= warpSpeed;
    if (s.z < 1) { newWarpStar(s, true); continue; }
    const x = cx + (s.x / s.z) * f, y = cy + (s.y / s.z) * f;
    const px = cx + (s.x / s.pz) * f, py = cy + (s.y / s.pz) * f;
    if (x < -50 || x > WW + 50 || y < -50 || y > WH + 50) { newWarpStar(s, true); continue; }
    const a = Math.min(1, (1000 - s.z) / 600);
    wctx.strokeStyle = `rgba(${s.c},${a})`;
    wctx.lineWidth = Math.max(0.6, (1 - s.z / 1000) * 2.6);
    wctx.beginPath(); wctx.moveTo(px, py); wctx.lineTo(x, y); wctx.stroke();
  }
  requestAnimationFrame(drawWarp);
}
resizeWarp();
drawWarp();

function dotTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(0.22, "rgba(255,255,255,0.85)");
  gr.addColorStop(0.5, "rgba(255,255,255,0.25)");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function glowTexture(inner, outer) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, inner);
  gr.addColorStop(0.35, outer);
  gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
function textSprite(text, opts = {}) {
  const font = opts.font || '700 64px "Comfortaa", "Trebuchet MS", sans-serif';
  const pad = 40;
  const c = document.createElement("canvas");
  const g = c.getContext("2d");
  g.font = font;
  const w = Math.ceil(g.measureText(text).width) + pad * 2;
  const h = opts.px ? opts.px + pad * 2 : 64 + pad * 2;
  c.width = w; c.height = h;
  g.font = font;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = opts.glow || "rgba(255,61,139,1)";
  g.shadowBlur = 22;
  g.fillStyle = opts.color || "#ffe3ef";
  g.fillText(text, w / 2, h / 2);
  g.shadowBlur = 8;
  g.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sp = new THREE.Sprite(mat);
  const height = opts.height || 1.5;
  sp.scale.set(height * (w / h), height, 1);
  return sp;
}

const tmpV = hasThree ? new THREE.Vector3() : null;
function updateOverlays(t) {
  const W = window.innerWidth, H = window.innerHeight;
  for (const o of overlays) {
    o.anchor.position.y = o.baseY + Math.sin(t * 0.9 + o.phase) * 0.7;
    o.anchor.getWorldPosition(tmpV);
    const dist = tmpV.distanceTo(camera.position);
    tmpV.project(camera);
    if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.25 || Math.abs(tmpV.y) > 1.25) {
      o.el.style.visibility = "hidden"; continue;
    }
    o.el.style.visibility = "visible";
    const x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * H;
    const s = Math.min(1.25, Math.max(0.35, (34 / dist) * o.size));
    o.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s.toFixed(3)})`;
    o.el.style.zIndex = String(Math.round(2000 - dist * 10));
    o.el.style.opacity = Math.min(1, Math.max(0.3, 1.5 - dist / 90)).toFixed(2);
  }
}

function heartbeat(t) {

  const side = loveIdx % 2 ? 1 : -1;
  el.style.setProperty("--x", ((heartWorld.x * 0.5 + 0.5) * W + side * (50 + Math.random() * 90)) + "px");
  el.style.setProperty("--y", ((-heartWorld.y * 0.5 + 0.5) * H - 20 - Math.random() * 60) + "px");
  document.getElementById("overlays").appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}
const IDLE_MS = 2500;       // pause after the last touch before the spin returns
const SPIN_CAMERA = 0.2;     // OrbitControls autoRotateSpeed at full spin
const SPIN_GALAXY = 0.03;    // galaxy disk rotation, rad/s at full spin
let touching = false, cardOpen = false, lastTouch = performance.now(), spin = 0;
/* any touch anywhere (canvas, photo, heart) restarts the 2.5 s pause */
window.addEventListener("pointerdown", () => { lastTouch = performance.now(); spin = 0; }, true);
const clock = hasThree ? new THREE.Clock() : null;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* galaxy stands still for IDLE_MS after the last touch, then eases into a slow spin */
  const idle = !reduceMotion && !touching && !cardOpen && flight && flight.done &&
               performance.now() - lastTouch > IDLE_MS;
  spin = idle ? Math.min(1, spin + dt / 2) : 0;
  controls.autoRotate = spin > 0;
  controls.autoRotateSpeed = SPIN_CAMERA * spin;
  galaxyGroup.rotation.y += dt * SPIN_GALAXY * spin;
  galaxyGroup.children.forEach(ch => {
    if (ch.isMesh) {
      ch.rotation.y += dt * ch.userData.spin;
      ch.position.y = ch.userData.baseY + Math.sin(t + ch.userData.phase) * 0.6;
    }
  });

  const beat = reduceMotion ? 0 : heartbeat(t);
  const cycle = Math.floor(t / 1.15);
  if (cycle !== lastCycle) {
    lastCycle = cycle;
    if (cycle % 3 === 0) spawnLoveWord();
  }
  const grow = flight ? flight.heart : 0.01;
  heartGroup.scale.setScalar(grow * (1 + beat * 0.07));
  heartGroup.rotation.y = Math.sin(t * 0.5) * 0.35;
  heartGlow.material.opacity = 0.75 + beat * 0.25;

  if (flight && !flight.done) {
    const k = Math.min(1, (performance.now() - flight.start) / flight.dur);
    const e = ease(k);
    camera.position.lerpVectors(flight.from, flight.to, e);
    galaxyGroup.scale.setScalar(0.25 + 0.75 * easeOut(k));
    flight.heart = easeOut(Math.min(1, k * 1.4));
    camera.lookAt(controls.target);
    if (k >= 1) {
      flight.done = true;
      lastTouch = performance.now();
      controls.enabled = true;
      document.getElementById("overlays").classList.add("on");
      const hint = document.getElementById("hint");
      hint.classList.add("on");
      setTimeout(() => hint.classList.remove("on"), 7000);
    }
  } else {
    controls.update();
  }
  updateOverlays(t);
  renderer.render(scene, camera);
}

/* =====================================================================
   CARD
   ===================================================================== */
const card = document.getElementById("card");
const cardImg = document.getElementById("card-img");
let lastFocus = null;
function openCard({ img, title, text }) {
  lastFocus = document.activeElement;
  if (img) { cardImg.src = img; cardImg.hidden = false; } else { cardImg.hidden = true; cardImg.removeAttribute("src"); }
  document.getElementById("card-title").textContent = title;
  document.getElementById("card-text").textContent = text;
  card.classList.add("open");
  cardOpen = true;
  document.getElementById("card-close").focus({ preventScroll: true });
}
function closeCard() {
  card.classList.remove("open");
  cardOpen = false;
  lastTouch = performance.now();
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
document.getElementById("card-close").addEventListener("click", closeCard);
card.addEventListener("click", e => { if (e.target === card) closeCard(); });
window.addEventListener("keydown", e => { if (e.key === "Escape" && card.classList.contains("open")) closeCard(); });

/* =====================================================================
   MUSIC
   ===================================================================== */
const musicBtn = document.getElementById("music");
let audio = null;
if (LOVE.music) {
  audio = new Audio();
  audio.loop = true;
  audio.preload = "auto";
  audio.addEventListener("canplay", () => { musicBtn.hidden = false; }, { once: true });
  audio.addEventListener("error", () => { audio = null; musicBtn.hidden = true; });
  audio.src = LOVE.music;
}
function setPlaying(on) {
  musicBtn.classList.toggle("playing", on);
  musicBtn.setAttribute("aria-label", on ? "Вимкнути музику" : "Увімкнути музику");
}
musicBtn.addEventListener("click", () => {
  if (!audio) return;
  if (audio.paused) audio.play().then(() => setPlaying(true)).catch(() => {});
  else { audio.pause(); setPlaying(false); }
});

/* =====================================================================
   START
   ===================================================================== */
function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const loads = Promise.all([
    document.fonts.load('700 64px "Comfortaa"'),
    document.fonts.load('700 120px "Caveat"')
  ]).catch(() => {});
  return Promise.race([loads, new Promise(r => setTimeout(r, 2500))]);
}

const startBtn = document.getElementById("start");
if (!hasThree) {
  startBtn.hidden = true;
  const msg = document.createElement("p");
  msg.id = "fallback";
  msg.textContent = "Не вдалося завантажити 3D. Перевір інтернет і онови сторінку.";
  document.getElementById("intro-content").appendChild(msg);
} else {
  startBtn.disabled = true;
  fontsReady().then(() => {
    try {
      buildScene();
      animate();
      startBtn.disabled = false;
    } catch (err) {
      startBtn.hidden = true;
      const msg = document.createElement("p");
      msg.id = "fallback";
      msg.textContent = "Цей браузер не показує 3D. Спробуй відкрити в Chrome або Safari.";
      document.getElementById("intro-content").appendChild(msg);
    }
  });
}

startBtn.addEventListener("click", () => {
  startBtn.disabled = true;
  if (audio) audio.play().then(() => setPlaying(true)).catch(() => {});
  document.getElementById("intro-content").classList.add("leaving");
  warpTarget = reduceMotion ? 3 : 16;
  setTimeout(() => {
    document.getElementById("intro").classList.add("gone");
    flight = {
      start: performance.now(),
      dur: reduceMotion ? 1500 : 6000,
      from: camera.position.clone(),
      to: new THREE.Vector3(0, 15, window.innerWidth < 700 ? 58 : 46),
      heart: 0,
      done: false
    };
    setTimeout(() => { warpRunning = false; }, 1600);
  }, reduceMotion ? 400 : 2400);
});

window.addEventListener("resize", () => {
  resizeWarp();
  if (!renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});
